<!DOCTYPE html>
<html lang="es">
<link rel="icon" type="image/png" href="logo.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThePeakyTrading | Track Record</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 40px 30px; 
            position: relative;
        }
        
        .top-brand {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 13px;
            color: #888;
            letter-spacing: 1px;
        }
        .top-brand strong { color: #fff; font-weight: 600; }
        .top-brand .badge { 
            color: #00E676; 
            font-size: 11px; 
            border: 1px solid #00E676; 
            padding: 3px 6px; 
            border-radius: 4px; 
            margin-left: 8px;
            text-transform: uppercase;
        }

        .container { max-width: 1000px; margin: auto; margin-top: 30px; }
        h1 { text-align: center; color: #00E676; margin-bottom: 40px; font-weight: 400; letter-spacing: 2px;}
        
        .metrics-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .metric-card { 
            background: #1e1e1e; 
            padding: 25px 20px; 
            border-radius: 8px; 
            text-align: center; 
            border: 1px solid #333; 
        }
        .metric-title { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px;}
        .metric-value { font-size: 32px; font-weight: bold; margin-top: 10px; color: #00E676; }
        
        .chart-container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #333; 
        }
    </style>
</head>
<body>
    <div class="top-brand">
        <strong>MAXIMILIANO</strong> | ThePeakyTrading <span class="badge">Quant Trader</span>
    </div>

    <div class="container">
        <h1>PERFORMANCE DASHBOARD</h1>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Win Rate</div>
                <div class="metric-value" id="winRate">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Profit Factor</div>
                <div class="metric-value" id="profitFactor">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Retorno Total</div>
                <div class="metric-value" id="returnPct">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Total Trades</div>
                <div class="metric-value" id="totalTrades">-</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="equityCurve"></canvas>
        </div>
    </div>

    <script>
        // El "?nocache=" fuerza al navegador a descargar el JSON nuevo siempre
        fetch('data.json?nocache=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                document.getElementById('winRate').innerText = data.metricas.win_rate + '%';
                document.getElementById('profitFactor').innerText = data.metricas.profit_factor;
                document.getElementById('returnPct').innerText = data.metricas.retorno_total_pct + '%';
                document.getElementById('totalTrades').innerText = data.metricas.total_trades;

                const labels = data.curva.map(trade => trade.fecha);
                const chartData = data.curva.map(trade => trade.crecimiento_pct);

                const ctx = document.getElementById('equityCurve').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Crecimiento (%)',
                            data: chartData,
                            borderColor: '#00E676',
                            backgroundColor: 'rgba(0, 230, 118, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.2,
                            pointRadius: 4,
                            pointBackgroundColor: '#121212'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: '#333' }, ticks: { color: '#888' } },
                            x: { grid: { color: '#333' }, ticks: { color: '#888' } }
                        }
                    }
                });
            })
            .catch(error => console.error('Error cargando los datos:', error));
    </script>
</body>
</html>
